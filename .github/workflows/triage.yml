name: Triage failed CI

# This repository uses its own action (`uses: ./`), so the sandbox pipeline in ci.yml exercises exactly what
# other repositories get. The workflow runs in the context of the default branch and can read secrets, so it
# must never check out or execute code from the failed run: it only reads that run's logs through the API.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
